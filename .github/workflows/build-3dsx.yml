name: Build 3DSX only

on:
  workflow_dispatch:

jobs:
  build-3dsx:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential g++ libpng-dev python3 python3-pil git
      - name: Bootstrap and build
        run: python3 tools/bootstrap.py --make -j4 --python python3
      - name: Engine-only 3DSX
        run: make -C build/upstream/3ds_port release PYTHON=python3
      - uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-bw2-3dsx
          path: |
            build/upstream/3ds_port/dist/Emerald3DS.3dsx
            build/upstream/3ds_port/dist/Emerald3DS.smdh
